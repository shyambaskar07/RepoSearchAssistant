<html>
    <head>
        <title>SI calculator</title>
    </head>
    <body>
        <script>
            alert('Hi, Welcome to the Simple Intrest Calculator!')
            let X=prompt("Enter X")
            let Y=prompt("Enter Y")
            let des=confirm('Enter your descision')
            let Z=Number(X)+Number(Y)
            if(des)
                {document.write("The value of X+Y equals "+Z)
                }
            else 
                {document.write('You have chosen to not calculate the result  '+des)
                }
            
        </script>
    </body>
