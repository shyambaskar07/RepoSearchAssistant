<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoSearch Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">RepoSearch Assistant</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{% url 'search_by_file' %}">File Origin</a>
        <a class="nav-link" href="{% url 'upload_file' %}">Upload</a>
      </div>
    </div>
  </nav>
  <div class="container">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5>Global GitHub Search</h5>
        <form method="post" action="{% url 'github_search' %}" class="row g-2">
          {% csrf_token %}
          <div class="col-md-10"><input type="text" name="query" class="form-control" placeholder="Search GitHub repos..." required></div>
          <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Search</button></div>
        </form>
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
